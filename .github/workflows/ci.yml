name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single, always-running job so it can be a required status check.
  # It discovers projects, so it passes trivially until the first service exists.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect projects
        id: detect
        shell: bash
        run: |
          dotnet=$(find services -mindepth 2 -maxdepth 4 \( -name '*.sln' -o -name '*.slnx' \) 2>/dev/null | sort || true)
          node=$(find web -mindepth 2 -maxdepth 3 -name package.json -not -path '*/node_modules/*' 2>/dev/null | sort || true)
          {
            echo "has_dotnet=$([ -n "$dotnet" ] && echo true || echo false)"
            echo "has_node=$([ -n "$node" ] && echo true || echo false)"
            echo "dotnet<<EOF"; echo "$dotnet"; echo "EOF"
            echo "node<<EOF"; echo "$node"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "dotnet solutions: ${dotnet:-none}"
          echo "node apps: ${node:-none}"

      - uses: actions/setup-dotnet@v4
        if: steps.detect.outputs.has_dotnet == 'true'
        with:
          dotnet-version: 10.0.x

      - name: Build and test .NET services
        if: steps.detect.outputs.has_dotnet == 'true'
        shell: bash
        run: |
          while IFS= read -r sln; do
            [ -z "$sln" ] && continue
            echo "::group::$sln"
            dotnet restore "$sln"
            dotnet build "$sln" --no-restore -c Release
            dotnet test "$sln" --no-build -c Release
            echo "::endgroup::"
          done <<< "${{ steps.detect.outputs.dotnet }}"

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_node == 'true'
        with:
          node-version: 22

      - name: Lint, test and build web apps
        if: steps.detect.outputs.has_node == 'true'
        shell: bash
        run: |
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            dir=$(dirname "$pkg")
            echo "::group::$dir"
            (cd "$dir" && npm ci && npm run lint --if-present && npm test --if-present && npm run build --if-present)
            echo "::endgroup::"
          done <<< "${{ steps.detect.outputs.node }}"
